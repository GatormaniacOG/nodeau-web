# Netlify configuration for nodeau.ai
#
# This is the MARKETING site. The installer is a separate deployment at
# get.nodeau.ai and nothing here should try to serve, mirror or duplicate it —
# the site links to it.
#
# No build step: the repository is plain HTML, CSS and JS, and Netlify copies
# it. That is deliberate. A marketing site that cannot be deployed without a
# toolchain is a marketing site that breaks when the toolchain moves.

[build]
  publish = "."
  command = ""
  # SKIP A PRODUCTION DEPLOY THAT CHANGES NOTHING THIS SITE SERVES. A production
  # deploy costs credits (15 on Netlify's credit plans, 2026-10); a push to main
  # that changes only the account app under app/ (which this site never serves:
  # /app/* redirects to app.nodeau.ai) would otherwise rebuild nodeau.ai for
  # nothing. Exit 0 skips, anything else builds. GUARDED: with no cache Netlify
  # sets CACHED_COMMIT_REF equal to COMMIT_REF (its docs) or leaves it empty, and
  # a "Retry" with no new commit sets them equal (its staff), so an unguarded diff
  # finds nothing and would CANCEL a real deploy; both refs must be present and
  # different before a skip is possible. An unknown ref makes git fail: builds.
  #
  # PREVIEWS ARE OPT-IN (the deploy policy, platform repository
  # docs/operations/NETLIFY-DEPLOY-POLICY.md): a deploy preview or branch deploy
  # builds only for a branch named preview/…; any other is skipped. They cost no
  # credits, but they sit behind the team login, nothing reads them, and local
  # checks are the default. Only an EXPLICIT preview context can skip this way:
  # production, or no CONTEXT at all, falls through to the guarded rule above.
  ignore = "case \"$CONTEXT\" in deploy-preview|branch-deploy) case \"$HEAD\" in preview/*) exit 1 ;; esac; exit 0 ;; esac; [ -n \"$CACHED_COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':!app'"

# Clean URLs come from directory/index.html, so no redirect rules are needed
# for the pages themselves. There is deliberately no catch-all redirect: one
# would swallow the 404 and serve the homepage for every typo.
#
# ---------------------------------------------------------------------------
# The account application lives on its own host
# ---------------------------------------------------------------------------
#
# app.nodeau.ai is a SEPARATE Netlify site built from app/ in this repository.
# These rules exist so that the addresses people actually type — /login,
# /signin, /account — land somewhere sensible instead of on a 404, and so that
# printed or emailed links keep working if the app ever moves again.
#
# force = true on /app/*: the repository root is published as-is, so app/ is a
# real directory here and would otherwise be served as raw, unbuilt source.

[[redirects]]
  from = "/login"
  to = "https://app.nodeau.ai/signin"
  status = 302

[[redirects]]
  from = "/signin"
  to = "https://app.nodeau.ai/signin"
  status = 302

[[redirects]]
  from = "/sign-in"
  to = "https://app.nodeau.ai/signin"
  status = 302

[[redirects]]
  from = "/account"
  to = "https://app.nodeau.ai/"
  status = 302

[[redirects]]
  from = "/dashboard"
  to = "https://app.nodeau.ai/"
  status = 302

# The CLI prints this address when you run `nodeau login`, and somebody will
# type it without the app. subdomain. The query string carries the code and is
# preserved by Netlify automatically.
[[redirects]]
  from = "/activate"
  to = "https://app.nodeau.ai/activate"
  status = 302

[[redirects]]
  from = "/app/*"
  to = "https://app.nodeau.ai/:splat"
  status = 302
  force = true

# ---------------------------------------------------------------------------
# Repository files that are not pages
# ---------------------------------------------------------------------------
#
# The repository root is published as-is, so without these the README, the
# checker scripts and the raw docs sources were all served from nodeau.ai. None
# of it is secret (the repository is public) but none of it is a page either,
# and checker comments are full of internal vocabulary that should not be
# indexed under the product's own domain. A 404 with the site's own page.

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs-src/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------------------
# Old addresses
# ---------------------------------------------------------------------------
#
# The install guide used to live at /alpha/. It is linked from README files,
# release notes and other people's posts, so the address has to keep working —
# permanently, which is what 301 means to a search engine.

[[redirects]]
  from = "/alpha"
  to = "/install/"
  status = 301

[[redirects]]
  from = "/alpha/*"
  to = "/install/"
  status = 301

[[redirects]]
  from = "/download"
  to = "/install/"
  status = 301

# The version every page shows is read from the channel a visitor would install
# from. A 200 here is a PROXY, not a redirect: the browser sees a same-origin
# response, so the site needs no cross-origin permission and the installer's own
# configuration is untouched.
#
# It proxies to the channel's ORIGIN, the public release repository's Pages site,
# not to get.nodeau.ai: since 2026-10-18 get.nodeau.ai's /channel/* is itself a
# proxy to that origin, and Netlify follows one proxy hop, so a proxy to
# get.nodeau.ai is answered from get.nodeau.ai's own files, which hold no channel
# (a 404, and every version slot stays empty). Same bytes either way: the file
# get.nodeau.ai/channel/beta.json serves is this one.
[[redirects]]
  from = "/channel/beta.json"
  to = "https://gatormaniacog.github.io/nodeau-releases/channel/beta.json"
  status = 200
  force = true

# Convenience: `curl nodeau.ai/install.sh` should do what everyone expects it
# to do rather than 404.
[[redirects]]
  from = "/install.sh"
  to = "https://get.nodeau.ai/install.sh"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Every page references these with ?v=<first 8 of the file's sha256>, stamped by
# tools/stamp-assets.py and asserted by tools/check-site.py. Change the file and
# every page's URL changes with it, so a cached copy is not found rather than
# being trusted.
#
# THE STAMP IS THE GUARANTEE, NOT THIS NUMBER. Before it existed, this header
# said the assets were "content-addressed by name changes only" — and the names
# never changed. /docs shipped with a restructured stylesheet, and anyone who
# had visited in the previous hour got the new markup with the old CSS.
# max-age stays an hour because the URL now changes when the bytes do; raising
# it would be safe and is not worth the argument.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
